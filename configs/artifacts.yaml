# VOIX artifact manifest.
#
# Model weights and processed data are intentionally excluded from git by
# .gitignore.  This file is the single source of truth for what a checkout
# needs, and it is consumed by:
#   - voix/service.py preflight and info diagnostics
#   - scripts/setup/verify_artifacts.py
#
# Paths are project-relative.  SHA-256 values pin the audited artifacts so a
# restore cannot silently substitute a different checkpoint.  Licenses are
# recorded per artifact because the repository's MIT code license does not
# relicense third-party weights or dataset-derived residuals.
schema_version: 1
description: "Serving and evaluation artifacts for the VOIX V2/V3 research stack"

