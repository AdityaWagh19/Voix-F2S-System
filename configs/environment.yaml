seed: 42
device: "cuda"
checkpoint_dir: "D:/voix/checkpoints"
cache_dir: "D:/voix/checkpoints/hf_cache"

paths:
  project_root: "D:/voix"
  data_root: "D:/voix/data"
  checkpoints: "D:/voix/checkpoints"
  artifacts: "D:/voix/artifacts"
  features_h5: "D:/voix/data/processed/features.h5"
  training_index_csv: "D:/voix/data/processed/training_index.csv"
  feature_scaler: "D:/voix/data/processed/feature_scaler.pt"
  style_pairs: "D:/voix/data/processed/style_pairs.pt"
  face_fusion_checkpoint: "D:/voix/checkpoints/face_fusion.pt"
  cvae_checkpoint: "D:/voix/checkpoints/cvae_best.pt"
  adapter_checkpoint: "D:/voix/checkpoints/style_adapter_best.pt"
  librispeech_root: "D:/voix/data/raw/librispeech_ref/LibriSpeech/dev-clean-2"
  mediapipe_model: "D:/voix/checkpoints/mediapipe/face_landmarker.task"
  arcface_model: "buffalo_l"
  arcface_cache: "D:/voix/checkpoints"
  ecapa_model: "speechbrain/spkrec-ecapa-voxceleb"
  ecapa_savedir: "D:/voix/checkpoints/speechbrain/spkrec-ecapa"
  whisper_model: "openai/whisper-large-v3"
  audioseal_generator: "audioseal_wm_16bits"
  audioseal_detector: "audioseal_detector_16bits"

# LibriSpeech reference anchors for demographic-matched synthesis.
# Paths are relative to paths.librispeech_root.
# Selected by measured pyin pitch from LibriSpeech dev-clean-2.
anchors:
  male_young:   "1988/147956/1988-147956-0000.flac"  # 148.3 Hz -- energetic adult male
  male_mid:     "5694/64038/5694-64038-0000.flac"    # 130.5 Hz -- classic mid-range male
  male_senior:  "251/118436/251-118436-0000.flac"    # 118.5 Hz -- deep baritone
  female_young: "1993/147964/1993-147964-0000.flac"  # 201.8 Hz -- adult female
  female_mid:   "84/121550/84-121550-0000.flac"      # 221.5 Hz -- mid-range female
  male_young_age_threshold: 35
  male_senior_age_threshold: 60
  female_mid_age_threshold: 40

inference:
  blend_weight: 0.55
  alpha: 0.3
  beta: 0.05
  diffusion_steps: 20
  num_voices: 3
  temperature: 0.85
  loudness_target_lufs: -23.0
  enable_denoising: true
  enable_watermarking: true

training:
  cvae:
    beta_max: 1.0
    lambda_fb: 0.01
    warmup_ratio: 0.30
    epochs: 50
    batch_size: 256
    lr: 3.0e-4
    weight_decay: 1.0e-3
    dropout: 0.05
    seed: 42
    min_lr_ratio: 0.05
    grad_clip_norm: 1.0
    max_utterances_per_speaker: 20
    min_utterances_per_speaker: 3

  adapter:
    epochs: 60
    batch_size: 64
    lr: 5.0e-4
    weight_decay: 1.0e-3
    lambda_cos: 1.0
    lambda_triplet: 0.3
    triplet_margin: 0.2
    dropout: 0.1
    seed: 42
    grad_clip_norm: 1.0

hardware:
  max_vram_gb: 6.0
  tts_device: "cpu"
  onnx_device_id: -1
  num_workers: 0
