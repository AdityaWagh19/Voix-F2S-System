seed: 42
device: "cuda"
checkpoint_dir: "checkpoints"
cache_dir: "checkpoints/hf_cache"

# Filesystem entries are project-relative.  ``load_config`` resolves them
# against the repository root so a clean checkout runs without editing YAML.
# Model identifiers (arcface_model, ecapa_model, ...) are intentionally not
# resolved as paths.
paths:
  project_root: "."
  data_root: "data"
  checkpoints: "checkpoints"
  artifacts: "artifacts"
  features_h5: "data/processed/voxceleb2_v2/features_v2.h5"
  training_index_csv: "data/processed/voxceleb2_v2/index.csv"
  feature_scaler: "data/processed/voxceleb2_v2/face_scaler_v2.pt"
  style_pairs: "data/processed/style_pairs.pt"
  cvae_checkpoint: "checkpoints/cvae_cfvn_face192_latent128_diversity.pt"
  adapter_checkpoint: "checkpoints/style_adapter_cfvn_best.pt"
  cfvn_checkpoint: "results/checkpoints/cfvn_v2_best.pt"
  mediapipe_model: "checkpoints/mediapipe/face_landmarker.task"
  arcface_model: "buffalo_l"
  arcface_cache: "checkpoints"
  ecapa_model: "speechbrain/spkrec-ecapa-voxceleb"
  ecapa_savedir: "checkpoints/speechbrain/spkrec-ecapa"
  whisper_model: "openai/whisper-large-v3"
  audioseal_generator: "audioseal_wm_16bits"
  audioseal_detector: "audioseal_detector_16bits"

inference:
  # null = use the hardware profile's tuned step count.  A fixed 25 here
  # silently overrode the CPU profile (8 steps) and the budget-GPU profile (20).
  diffusion_steps: null
  alpha: 0.18
  beta: 0.22
  num_voices: 3
  temperature: 0.85
  loudness_target_lufs: -23.0
  enable_denoising: true
  enable_watermarking: false

training:
  cvae:
    beta_max: 1.0
    lambda_fb: 0.01
    warmup_ratio: 0.30
    epochs: 50
    batch_size: 256
    lr: 3.0e-4
    weight_decay: 1.0e-3
    dropout: 0.05
    seed: 42
    min_lr_ratio: 0.05
    grad_clip_norm: 1.0
    max_utterances_per_speaker: 20
    min_utterances_per_speaker: 3

  adapter:
    epochs: 60
    batch_size: 64
    lr: 5.0e-4
    weight_decay: 1.0e-3
    lambda_cos: 1.0
    lambda_triplet: 0.3
    triplet_margin: 0.2
    dropout: 0.1
    seed: 42
    grad_clip_norm: 1.0

# Hardware is auto-detected from configs/hardware.yaml at load time.  The
# resolved profile is attached to ``config["hardware"]`` by
# voix.utils.config.load_config; do not pin tts_device or diffusion_steps here.
