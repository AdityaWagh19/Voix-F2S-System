[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voix-f2s"
version = "0.1.0"
description = "Probabilistic Face-to-Voice Generation Through Cross-Modal Identity Modeling"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aditya Wagh" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "numpy>=1.26.0,<2.0",
    "scipy>=1.12.0",
    "pyyaml>=6.0.1",
    "h5py>=3.10.0",
    "safetensors>=0.4.3",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
serving = [
    "styletts2>=0.1.6,<0.2",
    "audioseal>=0.2.0,<0.3",
    "pyloudnorm>=0.2.0,<0.3",
    "librosa>=0.10.2",
    "nltk>=3.9.1",
    "transformers>=4.40.0,<5",
    "huggingface-hub>=0.23.0",
    "accelerate>=0.25.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.17.1",
    "mediapipe>=0.10.14",
    "opencv-python>=4.9.0",
    "pandas>=2.0.0",
]
evaluation = [
    "speechbrain>=1.0.0",
    "scikit-learn>=1.3.2",
    "funasr>=1.0.27",
    "transformers>=4.40.0,<5",
    "librosa>=0.10.2",
]
data = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "imageio-ffmpeg>=0.4.9",
    "requests>=2.31.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]


[project.scripts]
voix = "voix.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "neural: requires the real StyleTTS2 neural backend (set VOIX_RUN_NEURAL_TESTS=1)",
    "watermark: requires the real AudioSeal watermark model",
]

[tool.black]
line-length = 99
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 99